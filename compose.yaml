name: reconcileflow

x-app-environment: &app-environment
  RECONCILEFLOW_ENVIRONMENT: production
  RECONCILEFLOW_REPOSITORY_BACKEND: sqlalchemy
  RECONCILEFLOW_DATABASE_URL: postgresql+psycopg://reconcileflow:${POSTGRES_PASSWORD:-local-demo-only}@postgres:5432/${POSTGRES_DB:-reconcileflow}
  RECONCILEFLOW_REDIS_URL: redis://redis:6379/0
  RECONCILEFLOW_ASYNC_ENABLED: "true"
  RECONCILEFLOW_ASYNC_ROW_THRESHOLD: "1"
  RECONCILEFLOW_CORS_ORIGINS: http://localhost:8080
  RECONCILEFLOW_API_HOST: 0.0.0.0
  RECONCILEFLOW_LOG_LEVEL: ${RECONCILEFLOW_LOG_LEVEL:-INFO}
  RECONCILEFLOW_OTEL_ENABLED: ${RECONCILEFLOW_OTEL_ENABLED:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reconcileflow}
      POSTGRES_USER: ${POSTGRES_USER:-reconcileflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconcileflow} -d ${POSTGRES_DB:-reconcileflow}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "reconcileflow.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres-data:
