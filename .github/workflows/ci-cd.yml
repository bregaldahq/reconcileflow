name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Ambiente que receberá a versão publicada
        required: true
        default: none
        type: choice
        options:
          - none
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "./backend[dev]"

      - name: Instalar frontend
        run: npm ci --prefix frontend

      - name: Instalar Chromium para os testes de interface
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Executar verificação completa
        run: make verify

  runtime-smoke:
    name: Integração Docker
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validar scripts de entrega
        run: >-
          docker run --rm --volume "$PWD:/mnt:ro"
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          /mnt/scripts/deploy_remote.sh /mnt/scripts/smoke_test.sh

      - name: Construir e iniciar a aplicação
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Validar a aplicação em execução
        run: bash scripts/smoke_test.sh http://127.0.0.1:8080

      - name: Exibir diagnóstico em caso de falha
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Encerrar a aplicação
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publicar imagens
    if: github.event_name != 'pull_request'
    needs: [quality, runtime-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      backend-image: ${{ steps.release-refs.outputs.backend }}
      frontend-image: ${{ steps.release-refs.outputs.frontend }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nomes das imagens
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=${REGISTRY}/${repository}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${repository}/web" >> "$GITHUB_OUTPUT"

      - name: Gerar metadados do backend
        id: backend-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.images.outputs.backend }}
          tags: |
            type=sha,format=long
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Gerar metadados do frontend
        id: frontend-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.images.outputs.frontend }}
          tags: |
            type=sha,format=long
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Construir e publicar backend
        id: backend-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: true
          sbom: true

      - name: Construir e publicar frontend
        id: frontend-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: true
          sbom: true

      - name: Atestar imagem do backend
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.backend }}
          subject-digest: ${{ steps.backend-build.outputs.digest }}
          push-to-registry: true

      - name: Atestar imagem do frontend
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.frontend }}
          subject-digest: ${{ steps.frontend-build.outputs.digest }}
          push-to-registry: true

      - name: Exportar referências imutáveis
        id: release-refs
        shell: bash
        run: |
          echo "backend=${{ steps.images.outputs.backend }}@${{ steps.backend-build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ steps.images.outputs.frontend }}@${{ steps.frontend-build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Implantar
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_environment != 'none'))
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || (github.event_name == 'workflow_dispatch' && inputs.deploy_environment || 'staging') }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      BACKEND_IMAGE: ${{ needs.publish.outputs.backend-image }}
      FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend-image }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validar configuração do ambiente
        shell: bash
        run: |
          : "${DEPLOY_HOST:?Configure o secret DEPLOY_HOST no ambiente do GitHub}"
          : "${DEPLOY_USER:?Configure o secret DEPLOY_USER no ambiente do GitHub}"
          : "${DEPLOY_SSH_KEY:?Configure o secret DEPLOY_SSH_KEY no ambiente do GitHub}"
          : "${DEPLOY_KNOWN_HOSTS:?Configure o secret DEPLOY_KNOWN_HOSTS no ambiente do GitHub}"
          : "${DEPLOY_PATH:?Configure a variável DEPLOY_PATH no ambiente do GitHub}"
          : "${PUBLIC_URL:?Configure a variável PUBLIC_URL no ambiente do GitHub}"
          : "${BACKEND_IMAGE:?A referência imutável do backend não foi gerada}"
          : "${FRONTEND_IMAGE:?A referência imutável do frontend não foi gerada}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "DEPLOY_PORT deve ser numérica"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "DEPLOY_USER possui formato inválido"; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "DEPLOY_HOST possui formato inválido"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "DEPLOY_PATH deve ser um caminho absoluto sem espaços"; exit 1; }
          [[ "$PUBLIC_URL" =~ ^https://[^[:space:]]+$ ]] || { echo "PUBLIC_URL deve ser uma URL HTTPS"; exit 1; }

      - name: Preparar conexão SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Enviar arquivos de implantação
        shell: bash
        run: |
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$remote" "install -d -m 750 '${DEPLOY_PATH}/scripts'"
          scp -P "$DEPLOY_PORT" compose.production.yaml "$remote:${DEPLOY_PATH}/compose.production.yaml"
          scp -P "$DEPLOY_PORT" scripts/deploy_remote.sh scripts/smoke_test.sh "$remote:${DEPLOY_PATH}/scripts/"

      - name: Implantar referências imutáveis
        shell: bash
        run: |
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          registry_config="${DEPLOY_PATH}/.docker-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_registry() {
            ssh -p "$DEPLOY_PORT" "$remote" \
              "rm -f -- '${registry_config}/config.json'; rmdir -- '${registry_config}' 2>/dev/null || true" \
              || true
          }
          trap cleanup_registry EXIT
          ssh -p "$DEPLOY_PORT" "$remote" "install -d -m 700 '${registry_config}'"
          printf '%s' "$REGISTRY_PASSWORD" | ssh -p "$DEPLOY_PORT" "$remote" \
            "docker --config '${registry_config}' login ghcr.io --username '${REGISTRY_USER}' --password-stdin"
          printf -v command 'DOCKER_CONFIG=%q bash %q %q %q %q' \
            "$registry_config" \
            "${DEPLOY_PATH}/scripts/deploy_remote.sh" \
            "$DEPLOY_PATH" "$BACKEND_IMAGE" "$FRONTEND_IMAGE"
          ssh -p "$DEPLOY_PORT" "$remote" "$command"

      - name: Validar URL pública
        run: bash scripts/smoke_test.sh "$PUBLIC_URL"
